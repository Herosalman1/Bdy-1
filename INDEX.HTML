<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Wish Link Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #120713;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    .card {
      background: #23122c;
      width: 100%;
      max-width: 480px;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }
    h2 {
      color: #ff5e97;
      font-size: 1.8rem;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      color: #d1c4e9;
      font-size: 0.95rem;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: #180a1f;
      border: 1px solid #3d1f4d;
      border-radius: 10px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s ease;
    }
    input[type="text"]:focus {
      border-color: #a855f7;
    }
    input[type="text"]::placeholder {
      color: #6a5375;
    }
    .btn-generate {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #d946ef, #8b5cf6);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3);
    }
    .btn-generate:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-generate:active {
      transform: translateY(0);
    }
    .result-box {
      margin-top: 25px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .url-output {
      width: 100%;
      padding: 12px;
      background: #15081b;
      border: 1px dashed #a855f7;
      border-radius: 8px;
      color: #38ef7d;
      font-size: 0.9rem;
      text-align: center;
    }
    .btn-copy {
      padding: 10px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Link Generator ✨</h2>
    <div class="input-group">
      <label for="friendName">Friend's Name:</label>
      <input type="text" id="friendName" placeholder="e.g. Rahul, Priya...">
    </div>
    <button class="btn-generate" onclick="generateLink()">Generate Link 🔗</button>

    <div class="result-box" id="resultBox">
      <input type="text" class="url-output" id="generatedUrl" readonly>
      <button class="btn-copy" id="copyBtn" onclick="copyLink()">Copy Link 📋</button>
    </div>
  </div>

  <script>
    function generateLink() {
      const name = document.getElementById('friendName').value.trim();
      if (!name) {
        alert('Kripya naam enter karein!');
        return;
      }
      const baseUrl = 'https://herosalman1.github.io/CANDLE-CAKE/surprise.html';
      const fullUrl = `${baseUrl}?name=${encodeURIComponent(name)}`;
      
      document.getElementById('generatedUrl').value = fullUrl;
      document.getElementById('resultBox').style.display = 'flex';
    }

    function copyLink() {
      const urlInput = document.getElementById('generatedUrl');
      urlInput.select();
      navigator.clipboard.writeText(urlInput.value);
      
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = 'Copied! ✅';
      copyBtn.style.background = '#10b981';
      setTimeout(() => {
        copyBtn.innerText = 'Copy Link 📋';
        copyBtn.style.background = '#3b82f6';
      }, 2000);
    }
  </script>

</body>
</html>
